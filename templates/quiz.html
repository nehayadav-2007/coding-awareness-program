{% extends "base.html" %}
{% block content %}
<div class="content-card quiz-card">
<div class="big-icon">🧠</div><h1>Coding Quiz</h1><p>Choose the correct answer. Each question is worth 10 points.</p>
<form method="POST">
{% for q in questions %}
<div class="question"><h3>{{ loop.index }}. {{ q.question }}</h3>
<label><input type="radio" name="q{{ q.id }}" value="A" required> A. {{ q.option_a }}</label>
<label><input type="radio" name="q{{ q.id }}" value="B"> B. {{ q.option_b }}</label>
<label><input type="radio" name="q{{ q.id }}" value="C"> C. {{ q.option_c }}</label>
<label><input type="radio" name="q{{ q.id }}" value="D"> D. {{ q.option_d }}</label>
</div>
{% endfor %}
<button class="btn primary">Submit Quiz 🚀</button>
</form>
</div>
{% endblock %}
