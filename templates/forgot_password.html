
{% extends "base.html" %}

{% block content %}

<div class="auth-wrap">
    <div class="auth-card">

        <div class="big-icon">🔑</div>

        <h2>Forgot Password?</h2>

        <p>Enter your registered email to reset your password.</p>

        <form method="POST">

            <input
                name="email"
                type="email"
                placeholder="Email address"
                required
            >

            <button class="btn primary full">
                Reset Password 🔐
            </button>

        </form>

        <p>
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </p>

    </div>
</div>

{% endblock %}
