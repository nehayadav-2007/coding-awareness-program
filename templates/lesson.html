{% extends "base.html" %} 
{% block content %} 
<div class="content-card lesson-detail"> 
<div class="lesson-icon">{{ lesson.icon }}</div><span class="level">{{ lesson.level }}</span> 
<h1>{{ lesson.title }}</h1><p>{{ lesson.description }}</p> 
</div> 
<div class="code-btn-container">
<div class="code-box">
<span># Example</span>
<pre>{{ lesson.example_code }}</pre>
</div>

<div class="code-box">
<span># Output</span>
<pre>{{ lesson.example_output }}</pre>
</div>

<form method="POST"><button class="btn primary">Mark as Completed ✅</button></form> 
<a class="text-link" href="{{ url_for('lessons') }}">← Back to lessons</a> 
</div> </div>
{% endblock %}
